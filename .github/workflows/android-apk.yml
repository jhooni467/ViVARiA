name: ViVARiA Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vivaria-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and export Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "ndk;28.1.13356709"

      - name: Set up Godot 4.7.2
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7.2-stable
          export-templates: true

      - name: Prepare debug signing key
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/vivaria"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/vivaria/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/vivaria/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Validate project and scripts
        run: |
          godot --headless --editor --path . --quit
          godot --headless --path . --quit-after 2

      - name: Export debug APK
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/ViVARiA.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViVARiA-Android-APK
          path: build/android/ViVARiA.apk
          if-no-files-found: error
          retention-days: 14
